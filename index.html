<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cosmos" />
<title>COSMOS</title>
<style>
  :root{
    --accent:#ffffff;
    --accent-rgb:255,255,255;
    --bg:#000000;
    --panel:rgba(255,255,255,.055);
    --border:rgba(255,255,255,.12);
    --muted:rgba(255,255,255,.55);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;overflow:hidden}
  body{background:var(--bg);transition:background 900ms cubic-bezier(.2,.8,.2,1)}
  canvas#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;opacity:.36;transition:opacity .8s,background .8s;
    background:radial-gradient(circle at 50% 35%, rgba(var(--accent-rgb),.13), transparent 28%),
               radial-gradient(circle at 20% 85%, rgba(var(--accent-rgb),.08), transparent 24%);
    filter:blur(45px)}
  .app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-top:max(18px,env(safe-area-inset-top))}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 22px 6px}
  .brand{font-size:12px;font-weight:700;letter-spacing:.28em;color:rgba(255,255,255,.82)}
  .utc-pill{font-size:11px;letter-spacing:.08em;color:var(--muted);border:1px solid var(--border);padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.28);backdrop-filter:blur(18px)}
  main{flex:1;position:relative;overflow:hidden}
  .view{position:absolute;inset:0;padding:22px 20px 118px;overflow:auto;opacity:0;transform:translateY(8px) scale(.995);pointer-events:none;transition:.32s ease}
  .view.active{opacity:1;transform:none;pointer-events:auto}
  .home{display:flex;align-items:center;justify-content:center;text-align:center}
  .hero{max-width:520px;margin-top:-8vh}
  .eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
  .quote{font-size:clamp(32px,8vw,58px);line-height:.98;font-weight:650;letter-spacing:-.05em;text-wrap:balance;text-shadow:0 0 30px rgba(var(--accent-rgb),.12)}
  .quote em{font-style:normal;color:var(--accent)}
  .sub{margin:24px auto 0;max-width:320px;color:var(--muted);font-size:14px;line-height:1.55}
  .section-head{display:flex;align-items:end;justify-content:space-between;margin:8px 3px 22px}
  h1{font-size:34px;line-height:1;margin:0;letter-spacing:-.045em}
  .section-head span{font-size:12px;color:var(--muted)}
  .event-list{display:grid;gap:11px}
  .event{position:relative;display:grid;grid-template-columns:54px 1fr auto;gap:13px;align-items:center;padding:14px 14px;border:1px solid var(--border);background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border-radius:20px;backdrop-filter:blur(20px);cursor:pointer;transition:.25s ease;overflow:hidden}
  .event:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 10% 50%,rgba(var(--event-rgb),.14),transparent 34%);opacity:.9;pointer-events:none}
  .event:active{transform:scale(.985)}
  .event.selected{border-color:rgba(var(--event-rgb),.55);box-shadow:0 0 34px rgba(var(--event-rgb),.09)}
  .icon{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:rgba(var(--event-rgb),.11);border:1px solid rgba(var(--event-rgb),.22);font-size:26px;filter:drop-shadow(0 0 11px rgba(var(--event-rgb),.25))}
  .meta{min-width:0}
  .name{font-size:16px;font-weight:650;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .time{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.02em}
  .count{text-align:right;font-variant-numeric:tabular-nums}
  .count strong{display:block;font-size:14px;font-weight:700}
  .count small{display:block;margin-top:4px;font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .detail{margin-top:14px;padding:18px;border-radius:24px;border:1px solid var(--border);background:rgba(0,0,0,.38);backdrop-filter:blur(22px);display:none}
  .detail.show{display:block;animation:fade .25s ease}
  .detail .big-icon{font-size:38px}
  .detail h2{font-size:24px;margin:10px 0 8px;letter-spacing:-.035em}
  .detail p{font-size:13px;line-height:1.55;color:var(--muted);margin:0}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .tabbar{position:absolute;left:14px;right:14px;bottom:calc(12px + var(--safe-bottom));height:72px;border:1px solid rgba(255,255,255,.14);border-radius:24px;background:rgba(8,8,8,.76);backdrop-filter:blur(28px) saturate(1.4);display:grid;grid-template-columns:repeat(3,1fr);padding:7px;box-shadow:0 18px 45px rgba(0,0,0,.5)}
  .tab{border:0;background:none;color:rgba(255,255,255,.42);border-radius:18px;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;font:inherit;cursor:pointer}
  .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
  .tab span{font-size:10px;font-weight:600}
  .tab.active{color:var(--accent);background:rgba(var(--accent-rgb),.08)}
  .empty{text-align:center;color:var(--muted);padding-top:25vh}
  ::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="aurora"></div>

<div class="app">
  <header>
    <div class="brand">COSMOS</div>
    <div class="utc-pill" id="utcClock">UTC --:--:--</div>
  </header>

  <main>
    <section class="view home active" id="home">
      <div class="hero">
        <div class="eyebrow">Your window into the universe</div>
        <div class="quote">“Somewhere, something <em>incredible</em> is waiting to be known.”</div>
        <div class="sub">Track celestial moments. Tap an event and let the universe change the atmosphere around you.</div>
      </div>
    </section>

    <section class="view" id="events">
      <div class="section-head">
        <div><div class="eyebrow" style="margin-bottom:9px">Live UTC</div><h1>Ereignisse</h1></div>
        <span id="eventCount"></span>
      </div>
      <div class="event-list" id="eventList"></div>
      <div class="detail" id="detail"></div>
    </section>

    <section class="view" id="sky">
      <div class="empty">
        <div style="font-size:38px;margin-bottom:12px">✦</div>
        <div style="font-size:20px;font-weight:650">Sky</div>
        <div style="font-size:13px;margin-top:8px">Dein nächster Bereich.</div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-tab="home" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M3.5 11.2 12 4l8.5 7.2v8.3a1.5 1.5 0 0 1-1.5 1.5h-5v-6H10v6H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-tab="events" aria-label="Ereignisse">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>
      <span>Ereignisse</span>
    </button>
    <button class="tab" data-tab="sky" aria-label="Sky">
      <svg viewBox="0 0 24 24"><path d="M4 18c4.5-1.2 9.7-5.8 12-12 1.9 6.1.4 11.8-4.2 14.3C9 21.8 6 20.8 4 18Z"/><path d="M8 15c2.6-.3 5.5-2.6 7.2-5.2"/></svg>
      <span>Sky</span>
    </button>
  </nav>
</div>

<script>
const events = [
  {name:"New Moon", date:"2026-09-11T03:27:00Z", icon:"●", rgb:"205,220,255", accent:"#dbe8ff", desc:"The Moon passes between Earth and the Sun; its illuminated side faces away from us."},
  {name:"Moon × Spica", date:"2026-09-13T20:53:00Z", icon:"☾", rgb:"225,235,255", accent:"#edf4ff", desc:"A close apparent pairing of the Moon and Spica, the brightest star in Virgo."},
  {name:"Moon × Venus", date:"2026-09-14T11:10:00Z", icon:"◐", rgb:"230,220,255", accent:"#eee6ff", desc:"The Moon appears near brilliant Venus — one of the brightest pairings in the sky."},
  {name:"Mars × Pollux", date:"2026-09-17T01:42:00Z", icon:"♂", rgb:"255,68,44", accent:"#ff4b35", desc:"Mars passes near Pollux in Gemini. Selecting Mars shifts the entire app into a red planetary glow."},
  {name:"First Quarter Moon", date:"2026-09-18T20:44:00Z", icon:"◑", rgb:"220,230,255", accent:"#eaf0ff", desc:"The Moon reaches first quarter, with half of its visible disk illuminated."},
  {name:"Autumnal Equinox", date:"2026-09-23T00:06:00Z", icon:"✦", rgb:"255,244,205", accent:"#fff2c9", desc:"The September equinox: the Sun crosses the celestial equator, marking astronomical autumn in the Northern Hemisphere."},
  {name:"Neptune Opposition", date:"2026-09-26T00:13:00Z", icon:"♆", rgb:"90,150,255", accent:"#78aaff", desc:"Neptune reaches opposition, appearing opposite the Sun in Earth's sky and near its brightest for the year."},
  {name:"Full Moon", date:"2026-09-26T16:49:00Z", icon:"○", rgb:"235,240,255", accent:"#f5f7ff", desc:"The Moon is fully illuminated as seen from Earth."}
];

const root = document.documentElement;
const list = document.getElementById("eventList");
const detail = document.getElementById("detail");
const countEl = document.getElementById("eventCount");

function fmtUTC(d){
  return new Intl.DateTimeFormat("en-GB",{timeZone:"UTC",day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}).format(d) + " UTC";
}
function countdown(target){
  let ms = target - new Date();
  if(ms <= 0) return {main:"Passed", sub:"event ended"};
  const s=Math.floor(ms/1000), days=Math.floor(s/86400), hrs=Math.floor((s%86400)/3600), mins=Math.floor((s%3600)/60), sec=s%60;
  if(days>0) return {main:`${days}d ${String(hrs).padStart(2,"0")}h`, sub:`${String(mins).padStart(2,"0")}m ${String(sec).padStart(2,"0")}s`};
  return {main:`${String(hrs).padStart(2,"0")}:${String(mins).padStart(2,"0")}:${String(sec).padStart(2,"0")}`, sub:"hours · min · sec"};
}
function render(){
  const now = new Date();
  const upcoming = events.filter(e => new Date(e.date) > now);
  countEl.textContent = upcoming.length + " upcoming";
  list.innerHTML = events.map((e,i)=>{
    const c=countdown(new Date(e.date));
    return `<article class="event" data-i="${i}" style="--event-rgb:${e.rgb}">
      <div class="icon">${e.icon}</div>
      <div class="meta"><div class="name">${e.name}</div><div class="time">${fmtUTC(new Date(e.date))}</div></div>
      <div class="count"><strong>${c.main}</strong><small>${c.sub}</small></div>
    </article>`;
  }).join("");
}
function selectEvent(i){
  const e=events[i];
  document.querySelectorAll(".event").forEach(x=>x.classList.remove("selected"));
  const card=document.querySelector(`.event[data-i="${i}"]`);
  if(card) card.classList.add("selected");
  root.style.setProperty("--accent",e.accent);
  root.style.setProperty("--accent-rgb",e.rgb);
  document.body.style.background = `radial-gradient(circle at 50% 18%, rgba(${e.rgb},.20), #000 45%)`;
  detail.innerHTML=`<div class="big-icon">${e.icon}</div><h2>${e.name}</h2><p>${e.desc}<br><br><strong style="color:#fff">${fmtUTC(new Date(e.date))}</strong></p>`;
  detail.classList.add("show");
  setTimeout(()=>detail.scrollIntoView({behavior:"smooth",block:"nearest"}),40);
}
render();
setInterval(()=>{
  document.getElementById("utcClock").textContent="UTC "+new Date().toLocaleTimeString("en-GB",{timeZone:"UTC",hour12:false});
  document.querySelectorAll(".event").forEach(card=>{
    const e=events[+card.dataset.i], c=countdown(new Date(e.date));
    card.querySelector(".count strong").textContent=c.main;
    card.querySelector(".count small").textContent=c.sub;
  });
},1000);

document.addEventListener("click",ev=>{
  const eventCard=ev.target.closest(".event");
  if(eventCard) selectEvent(+eventCard.dataset.i);
  const tab=ev.target.closest(".tab");
  if(tab){
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    document.getElementById(tab.dataset.tab).classList.add("active");
    if(tab.dataset.tab!=="events"){
      root.style.setProperty("--accent","#ffffff");
      root.style.setProperty("--accent-rgb","255,255,255");
      document.body.style.background="#000";
    }
  }
});

/* ~500 animated stars */
const canvas=document.getElementById("stars"), ctx=canvas.getContext("2d");
let W,H,DPR,stars=[];
function resize(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR; canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  stars=Array.from({length:500},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.15+.15,a:Math.random()*.8+.15,v:(Math.random()*.025+.008),p:Math.random()*Math.PI*2,dx:(Math.random()-.5)*.018}));
}
function animate(t){
  ctx.clearRect(0,0,W,H);
  for(const s of stars){
    s.y-=s.v; s.x+=s.dx;
    if(s.y<-2)s.y=H+2;if(s.x<0)s.x=W;if(s.x>W)s.x=0;
    const tw=s.a*(.68+.32*Math.sin(t*.0018+s.p));
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${Math.max(.05,tw)})`;ctx.fill();
    if(s.r>.95){ctx.beginPath();ctx.arc(s.x,s.y,s.r*3.5,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${tw*.045})`;ctx.fill();}
  }
  requestAnimationFrame(animate);
}
addEventListener("resize",resize);resize();requestAnimationFrame(animate);
</script>
</body>
</html>
