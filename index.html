<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Cosmos</title>
<style>
  :root{
    --accent:#ffffff;
    --accent-dim:rgba(255,255,255,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:#000000;
    color:#ffffff;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    overflow:hidden;
  }
  #stars{ position:fixed; inset:0; width:100%; height:100%; z-index:0; }
  .app{ position:relative; z-index:1; height:100dvh; width:100%; display:flex; flex-direction:column; }
  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 22px 10px; flex-shrink:0;
  }
  .brand{ font-size:19px; font-weight:600; letter-spacing:-0.01em; }
  .brand span{ color:var(--accent); font-weight:600; transition:color 0.6s; }
  .utc-clock{ font-size:11px; color:rgba(255,255,255,0.45); letter-spacing:0.02em; font-variant-numeric:tabular-nums; }
  main{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 18px 24px; }
  main::-webkit-scrollbar{ display:none; }
  .screen{ display:none; } .screen.active{ display:block; }

  .home-hero{
    min-height:56vh; display:flex; flex-direction:column; justify-content:center;
    align-items:center; text-align:center; gap:24px; padding:10px 6px 30px;
  }
  .quote{ font-size:22px; font-weight:600; line-height:1.4; max-width:300px; letter-spacing:-0.01em; }
  .quote-mark{ font-size:34px; color:rgba(255,255,255,0.35); line-height:0.5; font-weight:700; }
  .next-teaser{
    margin-top:6px; display:flex; align-items:center; gap:13px;
    background:rgba(28,28,30,0.75); border:1px solid rgba(255,255,255,0.1);
    padding:13px 18px; border-radius:16px; cursor:pointer;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  }
  .next-teaser .icon{ width:26px; height:26px; flex-shrink:0; }
  .next-teaser .txt{ text-align:left; }
  .next-teaser .label{ font-size:11px; color:rgba(255,255,255,0.45); letter-spacing:0.02em; }
  .next-teaser .name{ font-size:15px; font-weight:600; margin-top:2px; }
  .next-teaser .count{ font-size:12.5px; margin-top:2px; font-variant-numeric:tabular-nums; font-weight:600; color:var(--accent); }

  h2.section-title{ font-size:28px; font-weight:700; margin:20px 4px 2px; letter-spacing:-0.02em; }
  p.section-sub{ color:rgba(255,255,255,0.45); font-size:13px; margin:0 4px 18px; }

  .event-card{
    background:rgba(28,28,30,0.7); border:1.5px solid rgba(255,255,255,0.08);
    border-radius:16px; padding:15px 16px; margin-bottom:12px;
    display:flex; gap:13px; align-items:center; cursor:pointer;
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  }
  .event-card .icon-wrap{
    width:44px; height:44px; border-radius:12px; flex-shrink:0;
    background:rgba(255,255,255,0.06);
    display:flex; align-items:center; justify-content:center;
  }
  .event-card .icon-wrap svg{ width:22px; height:22px; }
  .event-body{ flex:1; min-width:0; }
  .event-name{ font-size:16px; font-weight:600; margin:0 0 2px; letter-spacing:-0.01em; }
  .event-date{ font-size:12px; color:rgba(255,255,255,0.45); margin:0 0 10px; }
  .countdown{ display:flex; gap:10px; }
  .cd-unit{ text-align:center; min-width:34px; }
  .cd-num{ font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--accent); }
  .cd-lbl{ font-size:9px; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:0.04em; }
  .chevron{ width:9px; height:9px; flex-shrink:0; opacity:0.35; }

  /* DETAIL SCREEN */
  .detail-back{
    display:flex; align-items:center; gap:6px; background:none; border:none;
    color:#fff; font-size:15px; font-weight:500; padding:8px 4px 18px; cursor:pointer;
  }
  .detail-back svg{ width:11px; height:11px; }
  .detail-hero{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:16px; padding:6px 0 26px; }
  .detail-icon{
    width:74px; height:74px; border-radius:20px; background:var(--accent-dim);
    display:flex; align-items:center; justify-content:center;
  }
  .detail-icon svg{ width:36px; height:36px; }
  .detail-name{ font-size:24px; font-weight:700; letter-spacing:-0.02em; margin:0; }
  .detail-date{ font-size:13px; color:rgba(255,255,255,0.5); margin:0; }
  .detail-countdown{ display:flex; gap:18px; margin-top:6px; }
  .detail-cd-unit{ text-align:center; }
  .detail-cd-num{ font-size:30px; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; }
  .detail-cd-lbl{ font-size:10px; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px; }
  .detail-block{
    background:rgba(28,28,30,0.7); border:1px solid rgba(255,255,255,0.08);
    border-radius:16px; padding:18px 18px; margin-bottom:14px;
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  }
  .detail-block h3{ font-size:13px; font-weight:600; margin:0 0 8px; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:0.04em; }
  .detail-block p{ font-size:14.5px; line-height:1.55; margin:0; color:rgba(255,255,255,0.9); }
  .detail-block ul{ margin:0; padding-left:18px; }
  .detail-block li{ font-size:14px; line-height:1.6; color:rgba(255,255,255,0.85); margin-bottom:4px; }

  .empty-tab{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; min-height:50vh; gap:10px; color:rgba(255,255,255,0.45);
  }
  .empty-tab svg{ width:32px; height:32px; opacity:0.4; }
  .empty-tab p{ font-size:13px; max-width:220px; margin:0; }

  nav.tabbar{
    flex-shrink:0; display:flex; justify-content:space-around; align-items:center;
    padding:9px 8px calc(env(safe-area-inset-bottom,0px) + 9px);
    background:rgba(10,10,12,0.78); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-top:0.5px solid rgba(255,255,255,0.12);
  }
  .tab{ background:none; border:none; color:rgba(255,255,255,0.42);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:10px; font-weight:500; padding:6px 15px; cursor:pointer; }
  .tab svg{ width:22px; height:22px; stroke:rgba(255,255,255,0.42); transition:stroke 0.2s; }
  .tab.active{ color:#ffffff; }
  .tab.active svg{ stroke:#ffffff; }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="app">
  <header class="topbar">
    <div class="brand">cos<span>mos</span></div>
    <div class="utc-clock" id="utcClock">--:--:-- UTC</div>
  </header>

  <main>
    <section class="screen active" id="screen-home">
      <div class="home-hero">
        <div class="quote-mark">&#8220;</div>
        <p class="quote">The sky is not the limit &mdash; it is only the beginning of the map.</p>
        <div class="next-teaser" onclick="switchTab('events')">
