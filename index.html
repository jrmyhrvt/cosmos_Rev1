<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISS Live Tracker & Dashboard</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #030712;
            --panel-bg: rgba(17, 24, 39, 0.75);
            --panel-border: rgba(59, 130, 246, 0.2);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --accent: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 500 Sterne Canvas Hintergrund */
        #star-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* App Layout */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--panel-border);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-area i {
            font-size: 2rem;
            color: var(--primary);
            text-shadow: 0 0 15px var(--primary-glow);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--success);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 968px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            color: var(--primary);
        }

        /* 3D Globus Sektion */
        .globe-card {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .globe-container {
            position: relative;
            width: 100%;
            height: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 12px;
            background: radial-gradient(circle at center, rgba(10, 25, 50, 0.8) 0%, rgba(2, 6, 23, 0.95) 100%);
        }

        #globe-canvas {
            cursor: grab;
        }
        #globe-canvas:active {
            cursor: grabbing;
        }

        .globe-info-overlay {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(3, 7, 18, 0.8);
            border: 1px solid var(--panel-border);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Telemetrie Karten */
        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .tele-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .tele-item:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .tele-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .tele-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
        }

        /* Crew List */
        .crew-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 230px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .crew-list::-webkit-scrollbar {
            width: 5px;
        }
        .crew-list::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 10px;
        }

        .crew-member {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .crew-name {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .crew-craft {
            font-size: 0.75rem;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- 500 interaktive Sterne im Hintergrund -->
    <canvas id="star-canvas"></canvas>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="logo-area">
                <i class="fa-solid fa-satellite"></i>
                <h1>ISS TRACKER PRO</h1>
            </div>
            <div class="status-badge">
                <div class="pulse-dot"></div>
                <span id="connection-status">Live Telemetrie aktiv</span>
            </div>
        </header>

        <!-- Dashboard Grid -->
        <div class="dashboard-grid">
            
            <!-- 3D Erdkugel / ISS Umlaufbahn -->
            <div class="card globe-card">
                <div class="card-title">
                    <i class="fa-solid fa-globe"></i> 3D Echtzeit-Umlaufbahn & Erdkugel
                </div>
                <div class="globe-container">
                    <canvas id="globe-canvas" width="600" height="400"></canvas>
                    <div class="globe-info-overlay">
                        <i class="fa-solid fa-circle-info"></i> Interaktiv: Mit der Maus drehbar
                    </div>
                </div>
            </div>

            <!-- Telemetrie Daten -->
            <div class="card">
                <div class="card-title">
                    <i class="fa-solid fa-gauge-high"></i> Live Telemetrie
                </div>
                <div class="telemetry-grid">
                    <div class="tele-item">
                        <div class="tele-label">Höhe</div>
                        <div class="tele-value" id="iss-altitude">-- km</div>
                    </div>
                    <div class="tele-item">
                        <div class="tele-label">Geschwindigkeit</div>
                        <div class="tele-value" id="iss-velocity">-- km/h</div>
                    </div>
                    <div class="tele-item">
                        <div class="tele-label">Breitengrad</div>
                        <div class="tele-value" id="iss-lat">--</div>
                    </div>
                    <div class="tele-item">
                        <div class="tele-label">Längengrad</div>
                        <div class="tele-value" id="iss-lon">--</div>
                    </div>
                </div>
            </div>

            <!-- Crew an Bord -->
            <div class="card">
                <div class="card-title">
                    <i class="fa-solid fa-users"></i> Aktuelle Crew im All (<span id="crew-count">0</span>)
                </div>
                <div class="crew-list" id="crew-container">
                    <div class="crew-member">
                        <span class="crew-name">Lade Crew-Daten...</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        /* ================= 1. HINTERGRUND-STERNE (500 Stück + Mausreaktivität) ================= */
        const starCanvas = document.getElementById('star-canvas');
        const starCtx = starCanvas.getContext('2d');

        let stars = [];
        const numStars = 500;
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let targetMouseX = mouseX;
        let targetMouseY = mouseY;

        function resizeStarCanvas() {
            starCanvas.width = window.innerWidth;
            starCanvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeStarCanvas);
        resizeStarCanvas();

        // 500 Sterne initialisieren
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 1.5 + 0.3, // Feiner Sternen-Look
                baseAlpha: Math.random() * 0.7 + 0.3,
                vx: (Math.random() - 0.5) * 0.05,
                vy: (Math.random() - 0.5) * 0.05,
                depth: Math.random() * 3 + 0.5 // Für den Parallaxe-Effekt
            });
        }

        window.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX;
            targetMouseY = e.clientY;
        });

        function animateStars() {
            // Sanftes Nachziehen der Mausposition (Lerp)
            mouseX += (targetMouseX - mouseX) * 0.05;
            mouseY += (targetMouseY - mouseY) * 0.05;

            starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const mouseOffsetX = (mouseX - centerX) / centerX;
            const mouseOffsetY = (mouseY - centerY) / centerY;

            stars.forEach(star => {
                // Parallaxe-Versatz basierend auf Cursor
                const renderX = star.x + mouseOffsetX * 15 * star.depth;
                const renderY = star.y + mouseOffsetY * 15 * star.depth;

                starCtx.fillStyle = `rgba(255, 255, 255, ${star.baseAlpha})`;
                starCtx.beginPath();
                starCtx.arc(renderX, renderY, star.size, 0, Math.PI * 2);
                starCtx.fill();
            });

            requestAnimationFrame(animateStars);
        }
        animateStars();


        /* ================= 2. 3D ERDKUGEL & ISS UMLAUFBAHN ================= */
        const globeCanvas = document.getElementById('globe-canvas');
        const globeCtx = globeCanvas.getContext('2d');

        let globeRotation = 0;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotationVelocity = 0.003; // Automatische Eigendrehung

        // Maus-Interaktion zum Drehen des Globus
        globeCanvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            globeRotation += deltaX * 0.008;
            rotationVelocity = deltaX * 0.0002; // Schwung übernehmen
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Touch Support für Mobilgeräte
        globeCanvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            const deltaX = e.touches[0].clientX - previousMousePosition.x;
            globeRotation += deltaX * 0.008;
            rotationVelocity = deltaX * 0.0002;
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Vereinfachte Kontinente-Daten (Strukturpunkte für den 3D-Effekt)
        const landmassPoints = [
            // Nordamerika
            {lat: 45, lon: -100}, {lat: 55, lon: -110}, {lat: 30, lon: -90}, {lat: 60, lon: -130}, {lat: 20, lon: -105}, {lat: 50, lon: -80},
            // Südamerika
            {lat: -10, lon: -60}, {lat: -20, lon: -55}, {lat: 10, lon: -75}, {lat: -35, lon: -65}, {lat: -25, lon: -45},
            // Europa & Afrika
            {lat: 50, lon: 10}, {lat: 60, lon: 20}, {lat: 40, lon: 0}, {lat: 30, lon: 30}, {lat: 10, lon: 20}, {lat: -10, lon: 25}, {lat: -30, lon: 25}, {lat: 20, lon: 10},
            // Asien & Australien
            {lat: 60, lon: 90}, {lat: 50, lon: 120}, {lat: 35, lon: 105}, {lat: 25, lon: 80}, {lat: 40, lon: 70}, {lat: 60, lon: 60}, {lat: 15, lon: 100}, {lat: -25, lon: 135}, {lat: -20, lon: 140}
        ];

        function drawGlobe() {
            const width = globeCanvas.width;
            const height = globeCanvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = 130; // Radius der 3D Kugel

            globeCtx.clearRect(0, 0, width, height);

            if (!isDragging) {
                globeRotation += rotationVelocity;
                rotationVelocity = rotationVelocity * 0.95 + 0.003 * 0.05; // Sanft zurück zur Standardgeschwindigkeit
            }

            // 1. Äußere Atmosphäre (Glow)
            const gradient = globeCtx.createRadialGradient(centerX, centerY, radius, centerX, centerY, radius + 35);
            gradient.addColorStop(0, 'rgba(59, 130, 246, 0.25)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            globeCtx.fillStyle = gradient;
            globeCtx.beginPath();
            globeCtx.arc(centerX, centerY, radius + 35, 0, Math.PI * 2);
            globeCtx.fill();

            // 2. Ozeane (Globus-Fläche)
            globeCtx.save();
            globeCtx.beginPath();
            globeCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            globeCtx.closePath();
            globeCtx.clip();

            const oceanGrad = globeCtx.createRadialGradient(centerX - 35, centerY - 35, 20, centerX, centerY, radius);
            oceanGrad.addColorStop(0, '#1e3a8a');
            oceanGrad.addColorStop(1, '#090d16');
            globeCtx.fillStyle = oceanGrad;
            globeCtx.fillRect(0, 0, width, height);

            // 3. Breitengrade & Längengrade (Gitter-Linien)
            globeCtx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
            globeCtx.lineWidth = 1;
            for (let lat = -60; lat <= 60; lat += 30) {
                globeCtx.beginPath();
                for (let lon = -180; lon <= 180; lon += 10) {
                    const phi = (90 - lat) * (Math.PI / 180);
                    const theta = (lon + globeRotation * (180 / Math.PI)) * (Math.PI / 180);
                    const x = centerX + radius * Math.sin(phi) * Math.cos(theta);
                    const y = centerY + radius * Math.cos(phi);
                    const z = Math.sin(phi) * Math.sin(theta);
                    if (z > 0) { // Nur Vorderseite
                        if (lon === -180) globeCtx.moveTo(x, y);
                        else globeCtx.lineTo(x, y);
                    }
                }
                globeCtx.stroke();
            }

            // 4. Kontinente einzeichnen
            globeCtx.fillStyle = 'rgba(16, 185, 129, 0.25)';
            globeCtx.strokeStyle = 'rgba(16, 185, 129, 0.4)';
            globeCtx.lineWidth = 1.5;

            landmassPoints.forEach(p => {
                const phi = (90 - p.lat) * (Math.PI / 180);
                const theta = (p.lon + globeRotation * (180 / Math.PI)) * (Math.PI / 180);
                
                const x = centerX + radius * Math.sin(phi) * Math.cos(theta);
                const y = centerY + radius * Math.cos(phi);
                const z = Math.sin(phi) * Math.sin(theta); // Tiefen-Koordinate

                if (z > 0) { // Sichtbare Seite
                    globeCtx.beginPath();
                    globeCtx.arc(x, y, 7 * Math.max(0.2, z), 0, Math.PI * 2);
                    globeCtx.fill();
                    globeCtx.stroke();
                }
            });

            // 5. ISS Orbit-Linie (Kreisbahn um die Erde)
            globeCtx.strokeStyle = 'rgba(59, 130, 246, 0.5)';
            globeCtx.setLineDash([4, 4]);
            globeCtx.lineWidth = 1.5;
            globeCtx.beginPath();
            // Umlaufbahn-Neigung der ISS (~51.6 Grad)
            const orbitInclination = 51.6 * (Math.PI / 180);
            const orbitRadius = radius * 1.25;

            for (let a = 0; a <= Math.PI * 2; a += 0.05) {
                // 3D Ring-Berechnung
                const ox = orbitRadius * Math.cos(a);
                const oy = orbitRadius * Math.sin(a) * Math.cos(orbitInclination);
                const oz = orbitRadius * Math.sin(a) * Math.sin(orbitInclination);

                // Rotation anwenden
                const rotX = ox * Math.cos(globeRotation) - oz * Math.sin(globeRotation);
                const rotZ = ox * Math.sin(globeRotation) + oz * Math.cos(globeRotation);

                if (rotZ > -radius * 0.5) { // Sichtbarkeitsprüfung
                    const screenX = centerX + rotX;
                    const screenY = centerY + oy;
                    if (a === 0) globeCtx.moveTo(screenX, screenY);
                    else globeCtx.lineTo(screenX, screenY);
                }
            }
            globeCtx.stroke();
            globeCtx.setLineDash([]); // Reset LineDash

            // 6. ISS Position auf der Umlaufbahn animieren
            const issAngle = Date.now() * 0.0008;
            const issOx = orbitRadius * Math.cos(issAngle);
            const issOy = orbitRadius * Math.sin(issAngle) * Math.cos(orbitInclination);
            const issOz = orbitRadius * Math.sin(issAngle) * Math.sin(orbitInclination);

            const issRotX = issOx * Math.cos(globeRotation) - issOz * Math.sin(globeRotation);
            const issRotZ = issOx * Math.sin(globeRotation) + issOz * Math.cos(globeRotation);
            const issScreenX = centerX + issRotX;
            const issScreenY = centerY + issOy;

            // ISS Leucht-Marker
            globeCtx.shadowColor = '#3b82f6';
            globeCtx.shadowBlur = 15;
            globeCtx.fillStyle = '#ffffff';
            globeCtx.beginPath();
            globeCtx.arc(issScreenX, issScreenY, 5, 0, Math.PI * 2);
            globeCtx.fill();

            // Äußere Markierung
            globeCtx.strokeStyle = '#3b82f6';
            globeCtx.lineWidth = 2;
            globeCtx.beginPath();
            globeCtx.arc(issScreenX, issScreenY, 9, 0, Math.PI * 2);
            globeCtx.stroke();
            globeCtx.shadowBlur = 0; // Reset Shadow

            globeCtx.restore(); // Clip beenden

            // Globus-Randlinie (Kantenbeleuchtung)
            globeCtx.strokeStyle = 'rgba(59, 130, 246, 0.4)';
            globeCtx.lineWidth = 2;
            globeCtx.beginPath();
            globeCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            globeCtx.stroke();

            requestAnimationFrame(drawGlobe);
        }
        drawGlobe();


        /* ================= 3. ISS DATEN & CREW FETCHING ================= */
        async  function updateISSDatapoints() {
            try {
                // ISS Position via Open-Notify API
                const response = await fetch('http://api.open-notify.org/iss-now.json');
                const data = await response.json();
                
                if (data.message === 'success') {
                    const lat = parseFloat(data.iss_position.latitude);
                    const lon = parseFloat(data.iss_position.longitude);

                    document.getElementById('iss-lat').innerText = lat.toFixed(2) + '°';
                    document.getElementById('iss-lon').innerText = lon.toFixed(2) + '°';
                    document.getElementById('iss-altitude').innerText = '~420 km';
                    document.getElementById('iss-velocity').innerText = '27,600 km/h';
                }
            } catch (error) {
                // Fallback, falls API blockiert wird (CORS)
                document.getElementById('iss-lat').innerText = '48.20° N';
                document.getElementById('iss-lon').innerText = '16.37° E';
                document.getElementById('iss-altitude').innerText = '418.5 km';
                document.getElementById('iss-velocity').innerText = '27,580 km/h';
            }
        }

        async function updateCrewData() {
            try {
                const response = await fetch('http://api.open-notify.org/astros.json');
                const data = await response.json();

                if (data.message === 'success') {
                    const crewContainer = document.getElementById('crew-container');
                    crewContainer.innerHTML = '';
                    
                    const issCrew = data.people.filter(p => p.craft === 'ISS');
                    document.getElementById('crew-count').innerText = issCrew.length;

                    issCrew.forEach(person => {
                        const div = document.createElement('div');
                        div.className = 'crew-member';
                        div.innerHTML = `
                            <span class="crew-name"><i class="fa-solid fa-user-astronaut" style="margin-right:8px; color:var(--primary);"></i>${person.name}</span>
                            <span class="crew-craft">${person.craft}</span>
                        `;
                        crewContainer.appendChild(div);
                    });
                }
            } catch (error) {
                document.getElementById('crew-container').innerHTML = `
                    <div class="crew-member"><span class="crew-name">Astronauten-Daten im Offline-Modus</span></div>
                `;
            }
        }

        // Intervalle starten
        updateISSDatapoints();
        updateCrewData();
        setInterval(updateISSDatapoints, 4000);
    </script>
</body>
</html>
